<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Swipe through campus events, keep a health score, and track sleep, workouts and spending.">
<meta name="theme-color" content="#4E2A84">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BWell">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>BWell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --ground:#241244; --app:#F5F3F9; --surface:#FFFFFF; --surface-2:#EEEAF5; --ink:#1D1628; --muted:#5E566D; --faint:#8C849D; --line:#E0DAEA;
  --accent:#4E2A84; --accent-ink:#FFFFFF; --accent-soft:#ECE5F7;
  --band1:#4E2A84; --band2:#351960; --on-band:#FFFFFF; --on-band-2:rgba(255,255,255,.72);
  --good:#16925A; --good-soft:#D9F1E3; --warn:#B07A00; --warn-soft:#F8EDCD; --bad:#CF3A3A; --bad-soft:#FADFDE;
  --shadow:0 1px 2px rgba(30,15,50,.07),0 14px 34px rgba(30,15,50,.16);
  --scrim:rgba(18,8,32,.5);
  --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0E0718; --app:#15111C; --surface:#1F1A28; --surface-2:#2A2335; --ink:#ECE8F2; --muted:#A79EB6; --faint:#7E758E; --line:#342C41;
    --accent:#B9A3EC; --accent-ink:#1B1030; --accent-soft:#2E2446;
    --band1:#34195E; --band2:#1D0F37;
    --good:#45C986; --good-soft:#163625; --warn:#EDB43A; --warn-soft:#3A2F12; --bad:#F06C6C; --bad-soft:#40201F;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 34px rgba(0,0,0,.5); --scrim:rgba(0,0,0,.62);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0E0718; --app:#15111C; --surface:#1F1A28; --surface-2:#2A2335; --ink:#ECE8F2; --muted:#A79EB6; --faint:#7E758E; --line:#342C41;
  --accent:#B9A3EC; --accent-ink:#1B1030; --accent-soft:#2E2446;
  --band1:#34195E; --band2:#1D0F37;
  --good:#45C986; --good-soft:#163625; --warn:#EDB43A; --warn-soft:#3A2F12; --bad:#F06C6C; --bad-soft:#40201F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 34px rgba(0,0,0,.5); --scrim:rgba(0,0,0,.62);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0}
.topbar{padding-top:calc(12px + env(safe-area-inset-top,0px))!important}
.app[data-tab] .band{margin-top:0}
body{background-color:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:disabled{cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,label:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink)}
input[type=range]{accent-color:var(--accent);width:100%}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

.stage{height:100%;display:grid;place-items:center;padding:16px}
.app{width:100%;max-width:430px;height:100%;max-height:900px;background:var(--app);border-radius:30px;box-shadow:0 30px 80px rgba(0,0,0,.45);overflow:hidden;display:flex;flex-direction:column;position:relative;isolation:isolate}
@media (max-width:520px){.stage{padding:0}.app{max-width:none;max-height:none;border-radius:0;box-shadow:none}}

/* Northwestern lakefront band */
.band{position:absolute;left:0;right:0;top:0;height:104px;z-index:0;border-radius:0 0 26px 26px;transition:height .35s cubic-bezier(.2,.8,.2,1);
  background-color:var(--band1);background-repeat:no-repeat,repeat,no-repeat;background-size:100% 58px,48px 16px,100% 100%;background-position:0 40px,0 98px,0 0}
.app[data-tab="discover"] .band{height:196px}
.band::after{content:"";position:absolute;left:16px;right:16px;top:97px;height:1px;background:rgba(255,255,255,.14)}

/* top bar */
.topbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:12px 16px 6px;position:relative;z-index:40}
.topbar .left{justify-self:start}.topbar .right{justify-self:end}
.pill-btn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);color:var(--on-band);font-weight:600;font-size:14px}
.pill-btn .badge{min-width:18px;height:18px;border-radius:9px;background:#fff;color:#4E2A84;font-size:11px;display:grid;place-items:center;padding:0 5px;font-weight:700}
.icon-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);color:var(--on-band)}
.icon-btn:disabled{opacity:.4}
.page-title{font-family:var(--display);font-weight:700;font-size:21px;color:var(--on-band)}
.wordmark{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--on-band-2)}
.ring-btn{border-radius:50%;padding:4px;display:grid;place-items:center;transition:background .3s;background:rgba(255,255,255,.16)}
.ring-btn.b-good{box-shadow:0 0 0 3px rgba(69,201,134,.55)}.ring-btn.b-warn{box-shadow:0 0 0 3px rgba(237,180,58,.6)}.ring-btn.b-bad{box-shadow:0 0 0 3px rgba(240,108,108,.65)}
.ring-btn.pulse{animation:pulse .6s ease}
@keyframes pulse{40%{transform:scale(1.12)}}
.ring .ring-track{fill:var(--surface);stroke:var(--line);stroke-width:5}
.ring .ring-val{fill:none;stroke-width:5.5;stroke-linecap:round}
.ring-good .ring-val{stroke:var(--good)}.ring-warn .ring-val{stroke:var(--warn)}.ring-bad .ring-val{stroke:var(--bad)}
.ring .ring-floor{stroke:var(--ink);stroke-width:2;stroke-linecap:round}
.ring .ring-num{font-family:var(--mono);font-weight:700;font-size:19px;fill:var(--ink)}
.ring .ring-sub{font-family:var(--body);font-weight:700;font-size:6.5px;fill:var(--muted);letter-spacing:.08em}

/* filters */
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:30;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.filters{position:absolute;left:0;right:0;top:0;z-index:35;background:var(--app);border-radius:0 0 24px 24px;padding:80px 16px 16px;transform:translateY(-105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);box-shadow:var(--shadow);max-height:94%;overflow:auto}
.filters.on{transform:none}
.fgroup{display:grid;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.fhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.fhead b{font-size:14px}
.fhead span{font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{height:33px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:7px}
.chip .dot{width:9px;height:9px;border-radius:50%}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip.lock{opacity:.6}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px}
.seg button{height:32px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted);padding:0 4px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.switch-row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.switch-row b{font-size:14px}
.switch{position:relative;width:44px;height:26px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:13px;background:var(--line);transition:background .2s;pointer-events:none}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::after{transform:translateX(18px)}
.switch input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.switch input:disabled{cursor:not-allowed}
.f-actions{display:flex;gap:10px;padding-top:14px;position:sticky;bottom:-16px;background:var(--app);padding-bottom:4px}
.btn{height:46px;border-radius:14px;padding:0 18px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.f-actions .btn.primary{flex:1}
.btn.ghost{background:var(--surface);border:1px solid var(--line)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.small{height:36px;font-size:13.5px;border-radius:11px;padding:0 13px}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.lock-tag{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:var(--accent-soft);color:var(--accent)}

/* pages */
.pages{flex:1;min-height:0;position:relative;z-index:1}
.page{position:absolute;inset:0;overflow:auto;padding:10px 16px 28px}
#page-discover{display:flex;flex-direction:column;overflow:hidden;padding-top:0;padding-bottom:10px}
.status{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--on-band-2);padding:6px 2px 12px;gap:8px}
.status .band-lbl{font-weight:700;color:var(--on-band);display:inline-flex;align-items:center;gap:6px}
.status .band-lbl i{width:8px;height:8px;border-radius:50%}
.t-good{color:var(--good)}.t-warn{color:var(--warn)}.t-bad{color:var(--bad)}
.bg-good{background:var(--good)}.bg-warn{background:var(--warn)}.bg-bad{background:var(--bad)}
.deck{position:relative;flex:1;min-height:0}
.card{position:absolute;inset:0;background:var(--surface);border-radius:24px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow);touch-action:none;user-select:none;-webkit-user-select:none;transform-origin:50% 90%;transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .3s}
.card.top{cursor:grab}
.card.top:active{cursor:grabbing}
.card.n1{transform:translateY(10px) scale(.955)}
.card.n2{transform:translateY(20px) scale(.91);opacity:.7}
.pic{flex:1 1 40%;min-height:112px;position:relative;color:#fff;overflow:hidden}
.pic .glyph{position:absolute;right:-14px;bottom:-18px;width:150px;height:150px;opacity:.26;stroke-width:1.1}
.pic .glyph2{position:absolute;left:16px;top:50%;width:50px;height:50px;transform:translateY(-50%);opacity:.95;stroke-width:1.5}
.prio{position:absolute;top:12px;left:12px;display:flex;align-items:center;gap:7px;height:30px;padding:0 11px 0 9px;border-radius:999px;background:rgba(10,8,20,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:12px;font-weight:700;letter-spacing:.02em}
.bars{display:flex;align-items:flex-end;gap:2px;height:13px}
.bars i{width:4px;border-radius:1px;background:rgba(255,255,255,.35)}
.bars i:nth-child(1){height:5px}.bars i:nth-child(2){height:9px}.bars i:nth-child(3){height:13px}
.p-high .bars i{background:#7CF0A8}
.p-moderate .bars i:nth-child(-n+2){background:#FFD166}
.p-low .bars i:nth-child(1){background:#FF8A8A}
.credit{position:absolute;top:12px;right:12px;min-width:58px;padding:5px 10px;border-radius:14px;background:#fff;color:#1D1628;text-align:center;line-height:1.05}
.credit b{display:block;font-family:var(--mono);font-size:19px}
.credit small{font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#6B6479}
.credit.pos b{color:#12844F}.credit.neg b{color:#C53030}
.pic .cat{position:absolute;left:14px;bottom:12px;font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;display:flex;gap:8px;align-items:center}
.pic .cat span{opacity:.82;font-weight:600;letter-spacing:.02em;text-transform:none}
.pic .more{position:absolute;right:12px;bottom:10px;font-size:11.5px;font-weight:700;background:rgba(10,8,20,.4);padding:4px 9px;border-radius:999px}
.stamp{position:absolute;top:56px;padding:4px 12px;border:3px solid;border-radius:10px;font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:.06em;opacity:0;background:rgba(255,255,255,.92)}
.stamp.go{left:18px;color:#12844F;transform:rotate(-12deg)}
.stamp.no{right:18px;color:#C53030;transform:rotate(12deg)}
.cbody{padding:13px 16px 15px;display:grid;gap:9px;flex:none}
.cbody h2{font-size:21px;line-height:1.15;font-weight:700}
.host{font-size:13px;color:var(--muted);margin-top:3px}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:7px 12px;font-size:13px}
.meta div{display:flex;gap:7px;align-items:flex-start;min-width:0}
.meta svg.i{width:16px;height:16px;margin-top:1px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;font-weight:600;padding:3px 9px;border-radius:8px;background:var(--surface-2);color:var(--muted);display:inline-flex;gap:5px;align-items:center}
.tag.pos{background:var(--good-soft);color:var(--good)}
.tag.neg{background:var(--bad-soft);color:var(--bad)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.acc{background:var(--accent-soft);color:var(--accent)}
.tag svg.i{width:13px;height:13px;stroke-width:2.2}
.faces{display:inline-flex}
.faces i{width:20px;height:20px;border-radius:50%;border:2px solid var(--surface);margin-left:-6px;display:grid;place-items:center;font-style:normal;font-size:8.5px;font-weight:700;color:#fff}
.faces i:first-child{margin-left:0}
.actions{display:flex;justify-content:center;align-items:center;gap:22px;padding:16px 0 2px}
.act{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);transition:transform .15s}
.act:active{transform:scale(.92)}
.act svg.i{width:27px;height:27px;stroke-width:2.4}
.act.no{color:var(--bad)}.act.yes{color:var(--good)}
.act.sm{width:44px;height:44px}
.act.sm svg.i{width:20px;height:20px;color:var(--muted)}
.act:disabled{opacity:.4}
.empty{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:10px;padding:20px;border-radius:24px;background:var(--surface);box-shadow:var(--shadow)}
.empty p{color:var(--muted)}
.empty .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:6px}

/* tab bar */
.tabbar{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--surface);padding:6px 4px calc(8px + env(safe-area-inset-bottom,0px));position:relative;z-index:2}
.tabbar button{display:grid;justify-items:center;gap:2px;padding:6px 0;font-size:10.5px;font-weight:600;color:var(--faint);border-radius:12px}
.tabbar button[aria-current="page"]{color:var(--accent)}
.tabbar svg.i{width:22px;height:22px}

/* generic page blocks */
.section{display:grid;gap:10px;margin-top:20px}
.section:first-child{margin-top:4px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.muted{color:var(--muted)}
.small{font-size:13px}
.big-num{font-family:var(--mono);font-weight:700;font-size:32px;line-height:1}
.list{display:grid}
.item{display:grid;grid-template-columns:60px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item.tap{cursor:pointer}
.item .when{font-family:var(--mono);font-size:11.5px;color:var(--muted);line-height:1.35}
.item .ttl{font-weight:600;font-size:14.5px;line-height:1.25}
.item .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.item .end{display:flex;align-items:center;gap:6px}
.cpill{font-family:var(--mono);font-weight:700;font-size:12.5px;padding:3px 8px;border-radius:8px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.cpill.pos{background:var(--good-soft);color:var(--good)}.cpill.neg{background:var(--bad-soft);color:var(--bad)}
.x-btn{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--faint)}
.x-btn:hover{background:var(--surface-2);color:var(--ink)}
.x-btn svg.i{width:16px;height:16px}
.day-h{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 2px}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 11px;min-width:0}
.stat b{font-family:var(--mono);font-size:19px;display:block;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat span{font-size:11.5px;color:var(--muted);display:block;line-height:1.3}
.stat .delta{font-family:var(--mono);font-size:11px;font-weight:700;margin-top:3px}
.hero-score{display:flex;gap:16px;align-items:center}
.rules{width:100%;border-collapse:collapse;font-size:13.5px}
.rules td{padding:8px 0;border-top:1px solid var(--line)}
.rules tr:first-child td{border-top:0}
.rules td:last-child{text-align:right;font-family:var(--mono);font-weight:700}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:var(--mono);font-size:9px;fill:var(--faint)}
.chart .hit{fill:transparent;cursor:crosshair}
.chart .bar{transition:opacity .15s;pointer-events:none}
.chart .hit:hover+.bar,.chart .bar.on{opacity:.75}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:14px;height:0;border-top:2px solid}
.hbar{display:grid;grid-template-columns:96px 1fr 56px;gap:10px;align-items:center;font-size:13px;padding:5px 0}
.hbar .track{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.hbar .fill{height:100%;border-radius:5px;background:var(--accent)}
.hbar b{font-family:var(--mono);text-align:right;font-size:12.5px}
.tip{position:absolute;z-index:90;pointer-events:none;background:var(--ink);color:var(--app);padding:7px 10px;border-radius:9px;font-size:12px;line-height:1.35;box-shadow:var(--shadow);max-width:200px}
.tip b{font-family:var(--mono);font-size:14px;display:block}
.field{display:grid;gap:5px;min-width:0}
.field label{font-size:12.5px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{height:42px;border-radius:11px;border:1px solid var(--line);background:var(--surface);padding:0 11px;width:100%;min-width:0}
.field textarea{height:70px;padding:9px 11px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.avatar{width:54px;height:54px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:21px;flex:none}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;flex:none}
.cal-src{display:flex;align-items:center;gap:10px;min-width:0}
.cal-src .sq{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.cal-src .sq svg.i{width:17px;height:17px}
.spin{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.progress{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.progress i{display:block;height:100%;border-radius:4px}
.goal{display:grid;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.goal:first-child{border-top:0;padding-top:2px}
.stepper{display:inline-flex;align-items:center;gap:4px;background:var(--surface-2);border-radius:10px;padding:2px}
.stepper button{width:28px;height:28px;border-radius:8px;font-weight:700}
.stepper button:hover{background:var(--surface)}
.stepper span{font-family:var(--mono);font-weight:700;font-size:13px;min-width:44px;text-align:center}
.person{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.person:first-child{border-top:0}
.match{font-family:var(--mono);font-weight:700;font-size:13px;color:var(--accent);text-align:right}
.promo{border-radius:22px;padding:20px 18px;color:#fff;background:linear-gradient(150deg,#4E2A84,#2A1450);position:relative;overflow:hidden}
.promo h2{font-size:26px;line-height:1.1;font-weight:800}
.promo p{color:rgba(255,255,255,.78);margin-top:8px}
.promo ul{list-style:none;padding:0;margin:16px 0 0;display:grid;gap:10px}
.promo li{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.promo li svg.i{color:#C9B6F2;margin-top:1px}
.plans{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.plan{border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:12px;text-align:left;display:grid;gap:2px}
.plan[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.plan b{font-family:var(--mono);font-size:20px}
.plan .save{font-size:11px;font-weight:700;color:var(--good)}
.blurred{filter:blur(4px);opacity:.7;pointer-events:none;user-select:none}

/* modal */
.overlay{position:absolute;inset:0;z-index:60;background:var(--scrim);display:flex;align-items:flex-end}
.sheet{background:var(--app);width:100%;max-height:94%;overflow:auto;border-radius:26px 26px 0 0;padding:22px 18px calc(18px + env(safe-area-inset-bottom,0px));animation:up .35s cubic-bezier(.2,.8,.2,1)}
.sheet.full{max-height:100%;height:100%;border-radius:0}
.sheet.flush{padding-top:0}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h1{font-size:27px;line-height:1.1;font-weight:800}
.sheet .lead{color:var(--muted);margin-top:8px}
.q{display:grid;gap:8px;padding:16px 0;border-bottom:1px solid var(--line)}
.q .row-between b{font-size:14.5px}
.q output{font-family:var(--mono);font-weight:700;font-size:15px}
.q .hint{font-size:12.5px;color:var(--muted)}
.preview{display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin:16px 0}
.credit-lines{display:grid;gap:6px;font-size:14px}
.credit-lines div{display:flex;justify-content:space-between;gap:10px}
.credit-lines b{font-family:var(--mono)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--muted);padding:12px 0}
.check input{width:18px;height:18px;accent-color:var(--accent);margin-top:1px;flex:none}
.linkbtn{color:var(--muted);font-weight:600;font-size:14px;padding:10px;text-decoration:underline;text-underline-offset:3px}
.block-icon{width:54px;height:54px;border-radius:16px;background:var(--bad-soft);color:var(--bad);display:grid;place-items:center;margin-bottom:12px}
.block-icon svg.i{width:28px;height:28px}
.math{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-weight:700;font-size:22px;margin:14px 0}
.math .arrow{color:var(--faint);font-size:16px}
.d-pic{margin:0 -18px;height:150px;flex:none;position:relative;color:#fff;overflow:hidden}
.d-grab{position:absolute;top:8px;left:50%;width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.6);transform:translateX(-50%)}
.d-close{position:absolute;right:12px;bottom:12px;width:34px;height:34px;border-radius:50%;background:rgba(10,8,20,.45);display:grid;place-items:center;color:#fff}
.d-rows{display:grid;gap:10px;font-size:14px}
.d-rows div{display:flex;gap:10px;align-items:flex-start}
.d-rows svg.i{color:var(--muted);margin-top:1px}
.d-sticky{position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom,0px));background:var(--app);padding:12px 0 4px;display:flex;gap:10px;margin-top:16px;border-top:1px solid var(--line)}
.d-sticky .btn{flex:1}

.toast{position:absolute;left:50%;bottom:92px;transform:translate(-50%,20px);background:var(--ink);color:var(--app);padding:10px 16px;border-radius:12px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:all .25s;z-index:80;width:max-content;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:360px){.stat-row{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

const pad = n => String(n).padStart(2,'0');
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseKey = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (k,n) => { const d = parseKey(k); d.setDate(d.getDate()+n); return keyOf(d); };
const diffDays = (a,b) => Math.round((parseKey(b) - parseKey(a)) / 864e5);
const TODAY = keyOf(new Date());
const clamp = (v,lo=0,hi=100) => Math.max(lo, Math.min(hi, v));
const toMin = t => { const [h,m] = t.split(':').map(Number); return h*60 + (m||0); };

function fmtTime(t){ let [h,m] = t.split(':').map(Number); const ap = h>=12 && h<24 ? 'PM' : 'AM'; h = h%12 || 12; return m ? `${h}:${pad(m)} ${ap}` : `${h} ${ap}`; }
const fmtRange = (s,e) => `${fmtTime(s)} – ${fmtTime(e)}`;
const shortDate = k => parseKey(k).toLocaleDateString('en-US',{month:'short',day:'numeric'});
function fmtDay(k, long){
  const n = diffDays(TODAY, k);
  if(n===0) return 'Today'; if(n===1) return 'Tomorrow'; if(n===-1) return 'Yesterday';
  return parseKey(k).toLocaleDateString('en-US', long ? {weekday:'long',month:'short',day:'numeric'} : {weekday:'short',month:'short',day:'numeric'});
}

function hash(s){ let h=0; for(const c of s) h=(h*31 + c.charCodeAt(0))|0; return Math.abs(h); }
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed>>>15, 1|seed); t = t + Math.imul(t ^ t>>>7, 61|t) ^ t; return ((t ^ t>>>14) >>> 0) / 4294967296; }; }
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');

function parseCSV(text){
  const rows=[]; let row=[], f='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(f); f=''; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(f); rows.push(row); row=[]; f=''; }
    else f+=c;
  }
  if(f||row.length){ row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}

const RULES = [
  {label:'Heavy drinking', pts:-20, re:/(bar crawl|pub crawl|open bar|kegger|bottomless|beer pong|shots)/i, drink:true},

function creditRules(ev){
  const text = `${ev.name} ${ev.location}`; const out=[]; let drink=false;
  for(const r of RULES){
    if(r.drink && drink) continue;
    const hit = (r.label==='Rest & recovery' && ev.category==='Wellness') || (r.re.test(r.drink ? text : ev.name) && !(r.label==='Workout' && (/Career|Academic/.test(ev.category) || /kickoff|meeting|info session|speaker/i.test(ev.name)))) || (r.label==='Workout' && ev.category==='Fitness');
    if(hit){ out.push({label:r.label, pts: r.drink ? -drinkCost() * (r.label==='Heavy drinking' ? 2 : 1) : r.label==='Workout' ? workoutEventPts(ev) : r.label==='Rest & recovery' ? restEventPts() : r.pts}); if(r.drink) drink=true; }
  }
  if(!drink && ev.drinking) out.push({label:'Light drinking', pts:-drinkCost()});
  const s = toMin(ev.start), e = toMin(ev.end);
  const pro = ev.category==='Career', drank = drink || ev.drinking;
  const stakes = /Career|Academic/.test(ev.category) && HIGH_STAKES_RE.test(ev.name);
  if(drank && pro) for(let i = out.length - 1; i >= 0; i--) if(/drinking/i.test(out[i].label)) out.splice(i, 1);  // professional receptions: no drinking cost, only work stress
  if(drank && !pro){ const d = out.find(r => /drinking/i.test(r.label)); if(d) d.pts = Math.round((d.pts + levelPts(0, DRINK_STRESS_SHIFT)) / 2); }  // drinking + alcohol stress shown as one averaged line
  else if(/Social|Nightlife|Arts|Volunteer|Career/.test(ev.category) && !stakes) out.push({label:'Social connection', pts:socialPts()});
  if(stakes) out.push({label:'High-stakes stress', pts:levelPts(0, HIGH_STAKES_SHIFT)});
  else if(ev.category==='Career' && NETWORKING_RE.test(ev.name)) out.push({label:'Networking stress', pts:levelPts(0, NETWORKING_STRESS_SHIFT)});
  else if(ev.category==='Career') out.push({label:'Work stress', pts:levelPts(0, CAREER_STRESS_SHIFT)});
  else if(ev.category==='Academic') out.push({label:'Work stress', pts:stressPts()});
  if(e < s || e >= 23*60+30) out.push({label:'Late night', pts:lateNightPts(ev)});
  const str = out.filter(r => r.pts < 0 && /drinking|stress|Late night/i.test(r.label));
  if(str.length > 1){ const sum = str.reduce((a,r)=>a+r.pts,0), comb = Math.round(sum / str.length * (1 + OVERLAP_BONUS * (str.length - 1)));
    out.push({label:`Overlapping stressors averaged (${str.length})`, pts: comb - sum}); }
  const j = jit('ev' + ev.name + ev.date, EVENT_JITTER);
  if(j) out.push({label:'Vibe check (random)', pts:j});
  if(out.reduce((a,r)=>a+r.pts,0) === 0){  // never show a 0-credit event: nudge by 1 point
    const v = out.find(r=>r.label.startsWith('Vibe')), d = v ? (Math.sign(v.pts) || 1) : (hash(ev.name + ev.date) % 2 ? 1 : -1);

  }

}
function recomputeCredits(){

}

const PREF_GROUPS = {social:['Social','Nightlife','Arts','Volunteer'], professional:['Career'], academics:['Academic'], health:['Fitness','Wellness']};
const PREF_LABELS = {social:'Social', professional:'Professional', academics:'Academics', health:'Health & wellness'};
function priorityOf(ev){

  const g = Object.keys(PREF_GROUPS).find(k => PREF_GROUPS[k].includes(ev.category)) || 'social';
  const v = prefs[g] ?? 5, why = [`You rated ${PREF_LABELS[g]} ${v}/10`];

function makeEvent(o){

  const f = state.filters, d = defaultFilters(); let n=0;
  for(const k of ['cats','times','settings','srcs']) if(f[k].length!==d[k].length) n++;
  for(const k of ['maxDist','when','prio','crowd','hideNeg','noClash','peers']) if(f[k]!==d[k]) n++;

}

/* ================= DECK ================= */
function picBG(ev){ const cat = CATS[ev.category]; return `radial-gradient(circle at 1px 1px, rgba(255,255,255,.2) 1px, transparent 1.6px) 0 0/14px 14px, linear-gradient(140deg, ${cat.g[0]}, ${cat.g[1]})`; }
function facesHTML(list){ return `<span class="faces">${list.slice(0,3).map(p=>`<i style="background:${p.color}">${initials(p.name)}</i>`).join('')}</span>`; }
function cardTags(ev){
  const cur = currentScore(), next = clamp(cur + ev.credit), tags=[];
  for(const r of ev.rules) tags.push(`<span class="tag ${cls(r.pts)}">${esc(r.label)} ${signed(r.pts)}</span>`);
  if(!ev.rules.length) tags.push(`<span class="tag">No health impact</span>`);
  const cl = clashes(ev);
  if(cl.length) tags.push(`<span class="tag warn">${svg(ICON.clash)}Clashes with ${esc(cl[0].ev.name)}</span>`);
  if(ev.credit<0 && next<state.profile.floor) tags.push(`<span class="tag neg">${svg(ICON.shield)}Would drop you to ${next}, under your floor</span>`);
  if(state.premium){ const pg = peersGoing(ev); if(pg.length) tags.push(`<span class="tag acc">${facesHTML(pg)}${pg.length} ${pg.length===1?'person':'people'} like you going</span>`); }
  return tags.join('');
}
function cardHTML(ev, pos){
  const cat = CATS[ev.category];
  const prio = {high:'High priority', moderate:'Moderate priority', low:'Low priority'}[ev.priority];
  return `<article class="card ${pos}" data-id="${ev.id}" ${pos==='top'?'tabindex="0" aria-label="'+esc(ev.name)+'. Tap for details."':'aria-hidden="true"'}>
    <div class="pic" style="background:${picBG(ev)}">

      <div class="cat">${esc(ev.category)}<span>via ${esc(ev.source)}</span></div>
      <div class="more">Tap for details</div>

    </div>

      <div class="meta">

        <div>${svg(ICON.pin)}<span>${esc(ev.location)}<br><span class="muted">${ev.setting==='Virtual'?'Virtual':ev.distance+' mi · '+ev.setting}</span></span></div>
        <div>${svg(ICON.people)}<span>${ev.attendees} going</span></div>

function renderDeck(){
  const q = queue(), deck = $('#deck');
  const on = SOURCES.filter(s=>state.calendars[s].on).length;
  $('#status-left').textContent = `${q.length} to review · ${on} calendar${on===1?'':'s'} synced`;
  const s = currentScore();
  $('#status-band').innerHTML = `<i class="bg-${band(s)}"></i>${bandLabel(s)}`;
  if(!q.length){
    const skipped = Object.values(state.decisions).filter(d=>d==='left').length;
    deck.innerHTML = `<div class="empty"><h2>You're all caught up</h2><p>No more events match your filters.</p>
      <div class="row"><button class="btn ghost small" data-act="filters">Adjust filters</button>${skipped?`<button class="btn ghost small" data-act="review">Review ${skipped} skipped</button>`:''}</div></div>`;
    $('#btn-yes').disabled = $('#btn-no').disabled = $('#btn-info').disabled = true;
    return;
  }
  $('#btn-yes').disabled = $('#btn-no').disabled = $('#btn-info').disabled = false;
  deck.innerHTML = q.slice(0,3).map((ev,i)=>cardHTML(ev, ['top','n1','n2'][i])).reverse().join('');
  attachDrag($('.card.top'), q[0]);
}
function attachDrag(card, ev){
  if(!card) return;
  let d=null;
  const go = $('.stamp.go',card), no = $('.stamp.no',card);
  card.addEventListener('pointerdown', e => { if(e.button!==0) return; d={x:e.clientX,y:e.clientY,dx:0,dy:0}; card.setPointerCapture(e.pointerId); card.style.transition='none'; });
  card.addEventListener('pointermove', e => {
    if(!d) return; d.dx=e.clientX-d.x; d.dy=e.clientY-d.y;
    card.style.transform=`translate(${d.dx}px,${d.dy*.25}px) rotate(${d.dx/16}deg)`;
    go.style.opacity = clamp(d.dx/90,0,1); no.style.opacity = clamp(-d.dx/90,0,1);
  });
  const end = () => {
    if(!d) return; const {dx,dy}=d; d=null; card.style.transition='';
    if(dx>100) decide('right'); else if(dx<-100) decide('left');
    else { card.style.transform=''; go.style.opacity=no.style.opacity=0; if(Math.abs(dx)<6 && Math.abs(dy)<6) openDetails(ev,'deck'); }
  };
  card.addEventListener('pointerup', end); card.addEventListener('pointercancel', end);
  card.addEventListener('keydown', e => { if(e.key==='Enter') openDetails(ev,'deck'); });
}
function fly(card, dir, done){
  if(!card){ done(); return; }
  card.style.transition='transform .34s ease-in, opacity .34s';
  card.style.transform=`translate(${dir==='right'?560:-560}px,40px) rotate(${dir==='right'?24:-24}deg)`;
  card.style.opacity='0';
  $(dir==='right'?'.stamp.go':'.stamp.no',card).style.opacity=1;
  setTimeout(done, 300);
}
function decide(dir, opts={}){
  const ev = queue()[0]; if(!ev) return;
  const card = $('.card.top');
  if(dir==='right'){
    const cur = currentScore(), next = clamp(cur + ev.credit);
    if(ev.credit<0 && next<state.profile.floor){
      if(card){ card.style.transition=''; card.style.transform=''; card.querySelectorAll('.stamp').forEach(s=>s.style.opacity=0); }
      openBlock(ev, cur, next); return;
    }
    state.committed.push({on:TODAY, via:'swipe', ev, cal:opts.cal||'Google Calendar', remind:opts.remind||'30'});
  }
  state.decisions[ev.id] = dir; state.undo = {id:ev.id, dir}; save(); invalidate();
  fly(card, dir, () => { renderDeck(); renderTop(); });
  if(dir==='right') toast(`Added to ${opts.cal||'Google Calendar'} · ${signed(ev.credit)} credits`);
}
function undo(){
  const u = state.undo; if(!u) return;
  delete state.decisions[u.id];
  if(u.dir==='right') state.committed = state.committed.filter(x => !(x.via==='swipe' && x.ev.id===u.id && x.on===TODAY));
  state.undo = null; save(); renderDeck(); renderTop(); toast('Brought it back');
}

function removeCommitted(id){

/* ================= SCHEDULE ================= */
function renderSchedule(){
  const items = [...state.committed].sort((a,b)=>a.ev.date.localeCompare(b.ev.date)||a.ev.start.localeCompare(b.ev.start));
  const up = items.filter(x=>x.ev.date>=TODAY), past = items.filter(x=>x.ev.date<TODAY && x.ev.date>=addDays(TODAY,-7)).reverse();
  const wk = up.filter(x=>diffDays(TODAY,x.ev.date)<=6);
  const net = wk.reduce((a,x)=>a+x.ev.credit,0), cost = wk.reduce((a,x)=>a+x.ev.price,0);
  const clashCount = up.filter(x=>clashes(x.ev).length).length;
  const remLbl = {'0':'','15':'15 min','30':'30 min','60':'1 hr','1440':'1 day'};
  const row = x => {
    const cl = clashes(x.ev);
    return `<div class="item tap" data-open="${x.ev.id}"><div class="when">${fmtTime(x.ev.start)}<br>${fmtTime(x.ev.end)}</div>
      <div><div class="ttl">${esc(x.ev.name)}</div><div class="sub">${esc(x.ev.location)} · ${x.via==='swipe'?'Swiped right':'From '+esc(x.cal||x.ev.source)}${x.ev.price?' · '+money(x.ev.price):''}</div>
      ${x.remind && x.remind!=='0' && x.ev.date>=TODAY?`<div class="sub">${svg(ICON.bell).replace('class="i"','class="i" style="width:12px;height:12px;vertical-align:-1px"')} ${remLbl[x.remind]} before${x.cal?' · '+esc(x.cal):''}</div>`:''}
      ${cl.length?`<div class="sub t-warn">Overlaps ${esc(cl[0].ev.name)}</div>`:''}</div>
      <div class="end"><span class="cpill ${cls(x.ev.credit)}">${signed(x.ev.credit)}</span></div></div>`;
  };
  const group = list => { let h='', d=null; for(const x of list){ if(x.ev.date!==d){ if(d) h+='</div></div>'; d=x.ev.date; h+=`<div class="day-h">${fmtDay(d,true)}</div><div class="panel" style="padding:2px 14px"><div class="list">`; } h+=row(x); } return h ? h+'</div></div>' : ''; };
  $('#page-schedule').innerHTML = `
    <div class="section"><div class="stat-row">
      <div class="stat"><b>${up.length}</b><span>Upcoming</span></div>
      <div class="stat"><b class="${net>=0?'t-good':'t-bad'}">${signed(net)}</b><span>Net credits, next 7 days</span></div>
      <div class="stat"><b>${money(cost)}</b><span>Planned spend, next 7 days</span></div>
    </div>
    ${clashCount?`<div class="tag warn" style="justify-self:start">${svg(ICON.clash)}${clashCount} events overlap. Tap one to change it.</div>`:''}</div>
    <div class="section">${up.length ? group(up) : `<div class="panel muted">Nothing planned yet. Swipe right on an event to add it here.</div>`}</div>
    ${past.length?`<div class="section"><div class="eyebrow">Past 7 days</div>${group(past)}</div>`:''}`;
}
$('#page-schedule').addEventListener('click', e => {
  const r = e.target.closest('[data-open]'); if(!r) return;
  const x = state.committed.find(c=>c.ev.id===r.dataset.open); if(x) openDetails(x.ev, 'committed');
});

/* ================= PROGRESS ================= */
function lineChart(bks, stats){
  const W=340,H=150,L=28,R=12,T=14,B=22,w=W-L-R,h=H-T-B,f=state.profile.floor;
  const pts = bks.map((bk,i)=>({i, v:stats[i].avgScore, bk})).filter(p=>p.v!=null);
  const x = i => L + (bks.length<2 ? w/2 : i*w/(bks.length-1)), y = v => T + h - v/100*h;
  const line = pts.map((p,j)=>`${j?'L':'M'}${x(p.i).toFixed(1)},${y(p.v).toFixed(1)}`).join('');
  const grid = [0,50,100].map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+3}" text-anchor="end">${v}</text>`).join('');
  const lab = [0, Math.floor((bks.length-1)/2), bks.length-1].map(i=>`<text x="${x(i)}" y="${H-5}" text-anchor="${i===0?'start':i===bks.length-1?'end':'middle'}">${esc(bks[i].label)}</text>`).join('');
  const lastP = pts[pts.length-1];
  const hits = bks.map((bk,i)=>{ const s=stats[i]; const cw = w/Math.max(1,bks.length-1);
    return `<rect class="hit" x="${(x(i)-cw/2).toFixed(1)}" y="${T}" width="${cw.toFixed(1)}" height="${h}" data-tip="${esc(bk.long)}|${s.avgScore!=null?Math.round(s.avgScore):'—'}|average score"/>`; }).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Average score per period">
    ${grid}<line x1="${L}" x2="${W-R}" y1="${y(f)}" y2="${y(f)}" stroke="var(--bad)" stroke-width="1.2" stroke-dasharray="4 4"/>
    <text x="${W-R}" y="${y(f)+12}" text-anchor="end" style="fill:var(--bad)">floor ${f}</text>
    ${line?`<path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`:''}
    ${pts.map(p=>`<circle cx="${x(p.i)}" cy="${y(p.v)}" r="${p===lastP?4.5:2.5}" fill="${p===lastP?'var(--accent)':'var(--surface)'}" stroke="var(--accent)" stroke-width="1.6"/>`).join('')}
    ${lastP?`<text x="${x(lastP.i)-8}" y="${y(lastP.v)-9}" text-anchor="end" style="fill:var(--ink);font-weight:700;font-size:11px">${Math.round(lastP.v)}</text>`:''}
    <line id="xhair" x1="0" x2="0" y1="${T}" y2="${T+h}" stroke="var(--faint)" stroke-width="1" opacity="0"/>
    ${lab}${hits}</svg>`;
}
function barChart(bks, stats, period){
  const W=340,H=150,L=34,R=12,T=14,B=22,w=W-L-R,h=H-T-B;
  const budgets = bks.map(bk=>budgetFor(period,bk));
  const max = Math.max(10, ...stats.map(s=>s.spend+s.planned), ...budgets) * 1.12;
  const y = v => T + h - v/max*h, slot = w/bks.length, bw = Math.min(26, slot-6);
  const step = max>200 ? 100 : max>80 ? 50 : max>40 ? 20 : 10;
  let grid=''; for(let v=0; v<=max; v+=step) grid += `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+3}" text-anchor="end">$${v}</text>`;
  const bars = bks.map((bk,i)=>{ const s=stats[i], x0=L+i*slot+(slot-bw)/2, top=y(s.spend), over = s.spend>budgets[i];
    const planned = s.planned ? `<rect x="${x0}" y="${y(s.spend+s.planned)}" width="${bw}" height="${Math.max(0,y(s.spend)-y(s.spend+s.planned)-2)}" rx="3" fill="none" stroke="var(--accent)" stroke-dasharray="3 2"/>` : '';
    const r = Math.min(4, (y(0)-top)/2);
    return `<rect class="hit" x="${L+i*slot}" y="${T}" width="${slot}" height="${h}" data-tip="${esc(bk.long)}|${money(s.spend)}|spent${s.planned?` · ${money(s.planned)} planned`:''} · budget ${money(budgets[i])}"/>
      <path class="bar" d="M${x0},${y(0)}V${top+r}Q${x0},${top} ${x0+r},${top}H${x0+bw-r}Q${x0+bw},${top} ${x0+bw},${top+r}V${y(0)}Z" fill="${over?'var(--warn)':'var(--accent)'}"/>${planned}`; }).join('');
  const bl = period==='month' ? '' : `<line x1="${L}" x2="${W-R}" y1="${y(budgets[0])}" y2="${y(budgets[0])}" stroke="var(--ink)" stroke-width="1.2" stroke-dasharray="4 4"/><text x="${W-R}" y="${y(budgets[0])-5}" text-anchor="end" style="fill:var(--ink)">budget ${money(budgets[0])}</text>`;
  const lab = [0, Math.floor((bks.length-1)/2), bks.length-1].map(i=>`<text x="${L+i*slot+slot/2}" y="${H-5}" text-anchor="middle">${esc(bks[i].label)}</text>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Event money spent per period">${grid}${bars}${bl}${lab}</svg>`;
}
function delta(cur, prev, unit='', invert=false, dp=0){
  if(cur==null || prev==null) return '<div class="delta muted">—</div>';

  return `<div class="delta ${good?'t-good':'t-bad'}">${d>0?'▲':'▼'} ${Math.abs(d)}${unit}</div>`;
}

function goalData(){

    <div class="section"><div class="row-between"><div class="eyebrow">Connected calendars</div><button class="btn ghost small" data-sync="all">${svg(ICON.sync)}Sync all</button></div>
      <div class="panel" style="display:grid;gap:14px">
      ${SOURCES.map(src=>{ const pool = CAL_POOL[src], have = pool.filter(o=>state.committed.some(x=>x.ev.name===o.name && x.via==='subscribed')).length, inDeck = EVENTS.filter(e=>e.source===src).length;
        return `<div class="switch-row"><div class="cal-src"><span class="sq">${svg(ICON.cal)}</span><div style="min-width:0"><b>${src}</b>
          <div class="small muted" id="sync-${slug(src)}">${ago(state.calendars[src].synced)} · ${have} of your events · ${inDeck} to discover</div></div></div>
          <div style="display:flex;gap:8px;align-items:center"><button class="x-btn" data-sync="${src}" aria-label="Sync ${src}" ${state.calendars[src].on?'':'disabled'}>${svg(ICON.sync)}</button>
          <label class="switch"><input type="checkbox" data-cal="${src}" ${state.calendars[src].on?'checked':''} aria-label="Connect ${src}"><span></span></label></div></div>`; }).join('')}
    </div></div>

    <div class="section"><div class="eyebrow">Events you're already signed up for</div>
      <div class="panel" style="padding:2px 14px"><div class="list">${subs.length ? subs.map(x=>`<div class="item tap" data-open="${x.ev.id}"><div class="when">${fmtDay(x.ev.date).replace(/, /,'<br>')}</div>
        <div><div class="ttl">${esc(x.ev.name)}</div><div class="sub">${fmtRange(x.ev.start,x.ev.end)} · ${esc(x.ev.location)} · ${esc(x.cal||x.ev.source)}</div></div>
        <div class="end"><span class="cpill ${cls(x.ev.credit)}">${signed(x.ev.credit)}</span></div></div>`).join('')
        : '<div class="item" style="grid-template-columns:1fr"><span class="muted small">None yet. Sync a calendar or add one below.</span></div>'}</div></div>
      <form class="panel" id="sub-form" style="display:grid;gap:10px">
        <b style="font-size:14px">Add an event by hand</b>
        <div class="field"><label for="s-name">Event name</label><input id="s-name" required placeholder="Study group: ECON 310"></div>
        <div class="grid2">
          <div class="field"><label for="s-date">Date</label><input id="s-date" type="date" required value="${addDays(TODAY,1)}"></div>
          <div class="field"><label for="s-cat">Category</label><select id="s-cat">${Object.keys(CATS).map(c=>`<option>${c}</option>`).join('')}</select></div>
          <div class="field"><label for="s-start">Starts</label><input id="s-start" type="time" required value="18:00"></div>
          <div class="field"><label for="s-end">Ends</label><input id="s-end" type="time" required value="19:00"></div>
          <div class="field"><label for="s-loc">Location</label><input id="s-loc" placeholder="University Library"></div>
          <div class="field"><label for="s-price">Cost ($)</label><input id="s-price" type="number" min="0" step="1" value="0"></div>
          <div class="field"><label for="s-src">Save to</label><select id="s-src">${SOURCES.filter(s=>s!=='Campus Events').map(c=>`<option>${c}</option>`).join('')}</select></div>
          <div class="field"><label for="s-rem">Reminder</label><select id="s-rem"><option value="0">None</option><option value="15">15 min before</option><option value="30" selected>30 min before</option><option value="60">1 hour before</option><option value="1440">1 day before</option></select></div>
        </div>
        <div class="field"><label for="s-desc">Notes</label><textarea id="s-desc" placeholder="Room, what to bring, who's coming"></textarea></div>
        <button class="btn primary block" type="submit">Add to my schedule</button>
      </form></div>

    <div class="section"><div class="panel" style="display:grid;gap:12px">
      <div class="row-between"><div><b>Survey answers</b><div class="small muted">These set your baseline of ${state.baseline}.</div></div><button class="btn ghost small" data-act="survey">Retake</button></div>
      <div class="small muted">${p.sleepHours} h sleep · ${p.workoutDays} workouts/week of ${p.workoutMins} min · ${p.drinksPerWeek} drinks/week</div></div></div>

    <div class="section"><div class="eyebrow">Demo</div><div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn ghost small" data-act="checkin">Show today's check-in</button>
      <button class="btn danger small" data-act="reset">Start over</button></div></div>`;
}
function floorNote(s){ const f = state.profile.floor; return s >= f ? `You're at ${s}, ${s-f} above your floor.` : `You're at ${s}, which is under your floor. Credit-costing events are blocked until you recover.`; }
function syncCal(src){
  const btns = src==='all' ? [...document.querySelectorAll('[data-sync]')] : [document.querySelector(`[data-sync="${src}"]`)];
  btns.forEach(b=>{ b.disabled = true; const s=b.querySelector('svg'); if(s) s.classList.add('spin'); });
  setTimeout(() => {
    let added = 0; const list = src==='all' ? SOURCES.filter(s=>state.calendars[s].on) : [src];
    for(const s of list){ if(CONFIG.DEMO_MODE) for(const o of CAL_POOL[s]) if(addSubscribed(o, s, TODAY)) added++; state.calendars[s].synced = TODAY; }
    save(); renderAccount(); renderTop(); toast(added ? `Pulled in ${added} event${added===1?'':'s'} from ${src==='all'?'your calendars':src}` : `${src==='all'?'Calendars':src} already up to date`);
  }, 900);
}
const acct = $('#page-account');
acct.addEventListener('input', e => {
  const t = e.target, p = state.profile;
  if(t.id==='a-floor'){ p.floor=+t.value; $('#floor-out').textContent=p.floor; $('#floor-note').textContent=floorNote(currentScore()); save(); renderTop(); }
  if(t.id==='a-budget'){ p.budget=+t.value; $('#budget-out').textContent='$'+p.budget; save(); }
});
acct.addEventListener('change', e => {
  const t = e.target;
  if(t.dataset.cal){ state.calendars[t.dataset.cal].on = t.checked; save(); renderAccount(); renderTop(); toast(`${t.dataset.cal} ${t.checked?'connected':'disconnected'}`); }
});
let resetArmed = null;
acct.addEventListener('click', e => {
  const r = e.target.closest('[data-open]'); if(r){ const x = state.committed.find(c=>c.ev.id===r.dataset.open); if(x) openDetails(x.ev,'committed'); return; }
  const b = e.target.closest('button'); if(!b) return;
  if(b.dataset.sync){ syncCal(b.dataset.sync); return; }
  const act = b.dataset.act;
  if(act==='checkin') openCheckin(true);
  if(act==='survey') openOnboarding(true);
  if(act==='reset'){
    if(resetArmed){ clearTimeout(resetArmed); resetArmed=null; try{ localStorage.removeItem(STORE); }catch(_){} state = freshState(); lastScore=null; boot(); return; }
    b.textContent = 'Tap again to erase everything';
    resetArmed = setTimeout(()=>{ resetArmed=null; b.textContent='Start over'; }, 4000);
  }
});
acct.addEventListener('submit', e => {
  e.preventDefault();
  const src = $('#s-src').value;
  const ev = addSubscribed({ name:$('#s-name').value, date:$('#s-date').value, start:$('#s-start').value, end:$('#s-end').value,
    location:$('#s-loc').value, price:$('#s-price').value, category:$('#s-cat').value, description:$('#s-desc').value, remind:$('#s-rem').value, userMade:true }, src, TODAY);
  save(); renderAccount(); renderTop();
  toast(ev ? `Added to ${src} · ${signed(ev.credit)} credits` : 'That event is already on your schedule');
});

/* ================= MODALS ================= */
function openModal(html, full, extra){ const o=$('#overlay'); o.innerHTML=`<div class="sheet${full?' full':''}${extra?' '+extra:''}" role="dialog" aria-modal="true">${html}</div>`; o.hidden=false; o.oninput=null; }
function closeModal(){ const o=$('#overlay'); o.hidden=true; o.innerHTML=''; o.oninput=null; }
$('#overlay').addEventListener('click', e => { if(e.target.id==='overlay' && !$('#overlay .full')) closeModal(); });

function openOnboarding(retake){
  const p = state.profile;
  openModal(`
    <div class="promo" style="margin:-4px -4px 0;padding:18px"><div class="eyebrow" style="color:#C9B6F2">Welcome to BWell</div>
      <h2 style="margin-top:6px;font-size:25px">${retake?'Update your survey':"Let's set your starting score"}</h2>
      <p>Your answers set the baseline your score drifts back toward, and the floor the app won't let you drop under.</p></div>
    <div class="q"><div class="field"><label for="o-name">What should we call you?</label><input id="o-name" value="${esc(p.name)}"></div></div>
    <div class="q"><div class="row-between"><b>Usual sleep per night</b><output id="o-sleep-out"></output></div>
      <input type="range" id="o-sleep" min="4" max="11" step="0.5" value="${p.sleepHours}"><div class="hint">7–8 hours scores best.</div></div>
    <div class="q"><div class="row-between"><b>Workout days per week</b><output id="o-wd-out"></output></div>
      <input type="range" id="o-wd" min="0" max="7" step="1" value="${p.workoutDays}">
      <div class="row-between"><b style="font-weight:600;font-size:13.5px">Typical session</b><output id="o-wm-out" style="font-size:13.5px"></output></div>
      <input type="range" id="o-wm" min="0" max="120" step="5" value="${p.workoutMins}"></div>
    <div class="q"><div class="row-between"><b>Drinks per week</b><output id="o-dr-out"></output></div>
      <input type="range" id="o-dr" min="0" max="15" step="1" value="${p.drinksPerWeek}"></div>
    <div class="q"><b>What matters to you right now?</b><div class="hint">Sets which events show up as high, moderate or low priority (7+ high, 4-6 moderate, 0-3 low).</div></div>
    ${[['ps','Social','social'],['pp','Professional','professional'],['pa','Academics','academics'],['ph','Health & wellness','health']].map(([id,lab,k]) => `<div class="q"><div class="row-between"><b>${lab}</b><output id="o-${id}-out"></output></div>
      <input type="range" id="o-${id}" min="0" max="10" step="1" value="${(p.prefs||{})[k] ?? 5}" aria-label="${lab} priority"></div>`).join('')}
    <div class="q"><div class="row-between"><b>Weekly budget for going out</b><output id="o-bu-out"></output></div>
      <input type="range" id="o-bu" min="10" max="300" step="5" value="${p.budget}"></div>
    <div class="q" style="border-bottom:0"><div class="row-between"><b>Your floor</b><output id="o-fl-out"></output></div>
      <input type="range" id="o-fl" min="0" max="100" step="1" value="${p.floor}"><div class="hint">If an event would drop your score below this number, the app stops you from saying yes.</div></div>
    ${retake||!CONFIG.DEMO_MODE?'':`<label class="check"><input type="checkbox" id="o-sample" checked>Fill in five months of sample history and sync two classes from your calendars, so the charts have something to show.</label>`}
    <div class="preview"><div><div class="eyebrow">Starting score</div><div class="small muted">From the Quality-of-Life model (CDC data, 427K adults), based on your sleep, workouts and drinking.</div></div><div class="big-num" id="o-base"></div></div>
    <button class="btn primary block" id="o-go"></button>
    ${retake?'<div style="text-align:center"><button class="linkbtn" id="o-cancel">Cancel</button></div>':''}`, true);
  const upd = () => {
    const q = {sleepHours:+$('#o-sleep').value, workoutDays:+$('#o-wd').value, workoutMins:+$('#o-wm').value, drinksPerWeek:+$('#o-dr').value};
    $('#o-sleep-out').textContent = q.sleepHours+' h'; $('#o-wd-out').textContent = q.workoutDays; $('#o-wm-out').textContent = q.workoutMins+' min';
    for(const id of ['ps','pp','pa','ph']) $('#o-'+id+'-out').textContent = $('#o-'+id).value + '/10';
    $('#o-dr-out').textContent = q.drinksPerWeek; $('#o-fl-out').textContent = $('#o-fl').value; $('#o-bu-out').textContent = '$'+$('#o-bu').value;
    const b = baselineFrom(q); $('#o-base').textContent = b; $('#o-go').textContent = retake ? `Save · baseline ${b}` : `Start at ${b}`;
  };
  $('#overlay').oninput = upd; upd();
  if(retake) $('#o-cancel').onclick = closeModal;
  $('#o-go').onclick = () => {
    const p = state.profile;
    p.name = $('#o-name').value.trim() || 'You';
    p.sleepHours=+$('#o-sleep').value; p.workoutDays=+$('#o-wd').value; p.workoutMins=+$('#o-wm').value; p.drinksPerWeek=+$('#o-dr').value; p.floor=+$('#o-fl').value; p.budget=+$('#o-bu').value;
    p.prefs = {social:+$('#o-ps').value, professional:+$('#o-pp').value, academics:+$('#o-pa').value, health:+$('#o-ph').value};
    state.baseline = baselineFrom(p); recomputeCredits();
    if(!retake){ state.startDay = TODAY; if($('#o-sample')?.checked) seedSample(); state.onboarded = true; }
    save(); closeModal(); renderAll();
    if(!retake) setTimeout(()=>openCheckin(false), 250);
  };
}
function openCheckin(manual){
  state.promptedOn = TODAY; save();
  const prev = state.logs[TODAY];
  const init = prev ? {...prev} : {sleep:state.profile.sleepHours, workout:0, spend:0};
  const hr = new Date().getHours(), hello = hr<12 ? 'Morning' : hr<18 ? 'Afternoon' : 'Evening';
  openModal(`
    <div class="eyebrow">Daily check-in · ${parseKey(TODAY).toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'})}</div>
    <h1 style="margin-top:6px;font-size:24px">${hello}, ${esc(state.profile.name)}. How did last night go?</h1>
    <div class="q"><div class="row-between"><b>Hours of sleep</b><output id="c-sleep-out"></output></div>
      <input type="range" id="c-sleep" min="3" max="12" step="0.5" value="${init.sleep}"></div>
    <div class="q"><div class="row-between"><b>Workout minutes today</b><output id="c-wo-out"></output></div>
      <input type="range" id="c-wo" min="0" max="150" step="5" value="${init.workout}"><div class="hint">Log it later if you haven't trained yet.</div></div>
    <div class="q" style="border-bottom:0"><div class="row-between"><b>Spent today outside events</b><output id="c-sp-out"></output></div>
      <input type="range" id="c-sp" min="0" max="100" step="1" value="${init.spend||0}"><div class="hint">Food, coffee, rides. Event tickets are counted for you.</div></div>
    <div class="preview" style="display:block"><div class="credit-lines" id="c-lines"></div>
      <div class="row-between" style="margin-top:10px;padding-top:10px;border-top:1px solid var(--line)"><b>Score after check-in</b><span class="mono" style="font-weight:700;font-size:18px" id="c-score"></span></div></div>
    <button class="btn primary block" id="c-go">Log today</button>
    <div style="text-align:center"><button class="linkbtn" id="c-skip">${manual?'Cancel':'Not now'}</button></div>`);
  const read = () => ({sleep:+$('#c-sleep').value, workout:+$('#c-wo').value, spend:+$('#c-sp').value});
  const upd = () => {
    const l = read();
    $('#c-sleep-out').textContent = l.sleep+' h'; $('#c-wo-out').textContent = l.workout+' min'; $('#c-sp-out').textContent = money(l.spend);
    $('#c-lines').innerHTML = logRules(l).map(r=>`<div><span>${esc(r.label)}</span><b class="t-${r.pts>0?'good':r.pts<0?'bad':''}">${signed(r.pts)}</b></div>`).join('');
    const keep = state.logs[TODAY]; delete state.logs[TODAY]; invalidate(); const before = currentScore();
    state.logs[TODAY] = l; invalidate(); const after = currentScore();
    if(keep) state.logs[TODAY] = keep; else delete state.logs[TODAY]; invalidate();
    $('#c-score').textContent = `${before} → ${after}`;
  };
  $('#overlay').oninput = upd; upd();
  $('#c-go').onclick = () => { state.logs[TODAY] = read(); save(); closeModal(); renderAll(); toast('Check-in saved'); };
  $('#c-skip').onclick = closeModal;
}
function openBlock(ev, cur, next){
  openModal(`
    <div class="block-icon">${svg(ICON.shield)}</div>
    <h1 style="font-size:24px">This one would take you under your floor</h1>
    <p class="lead">${esc(ev.name)} costs ${Math.abs(ev.credit)} credits (${ev.rules.filter(r=>r.pts<0).map(r=>r.label.toLowerCase()).join(', ')}). Your floor is ${state.profile.floor}.</p>
    <div class="math"><span class="t-${band(cur)}">${cur}</span><span class="arrow">${signed(ev.credit)} →</span><span class="t-bad">${next}</span></div>
    <button class="btn primary block" id="b-skip">Skip it</button>
    <div style="text-align:center"><button class="linkbtn" id="b-keep">Keep it in the deck</button></div>
    <p class="small muted" style="text-align:center;margin-top:4px">A workout or a good night's sleep earns the room back. You can change your floor in Account.</p>`);
  $('#b-skip').onclick = () => { closeModal(); decide('left'); };
  $('#b-keep').onclick = closeModal;
}

/* ================= NAV + BOOT ================= */
let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'), msg.length>60 ? 6000 : 2200); }
const PAGES = ['discover','schedule','progress','premium','account'];
function renderPage(tab){ ({discover:renderDeck, schedule:renderSchedule, progress:renderProgress, premium:renderPremium, account:renderAccount})[tab](); }
function showTab(tab){
  if(!PAGES.includes(tab)) tab='discover';
  state.tab = tab; save(); toggleFilters(false);
  for(const t of PAGES) $('#page-'+t).hidden = t!==tab;
  renderTop(); renderPage(tab); $('#page-'+tab).scrollTop = 0;
}
function renderAll(){ renderTop(); renderPage(state.tab); if(state.tab!=='discover') renderDeck(); }

document.querySelector('.tabbar').addEventListener('click', e => { const b=e.target.closest('button'); if(b) showTab(b.dataset.tab); });
$('#ring').onclick = () => showTab('progress');
$('#btn-filters').onclick = () => toggleFilters();
$('#scrim').onclick = () => toggleFilters(false);
$('#btn-undo').onclick = undo;
$('#btn-yes').onclick = () => decide('right');
$('#btn-no').onclick = () => decide('left');
$('#btn-info').onclick = () => { const ev = queue()[0]; if(ev) openDetails(ev,'deck'); };
$('#deck').addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if(!a) return;
  if(a.dataset.act==='filters') toggleFilters(true);
  if(a.dataset.act==='review'){ for(const k in state.decisions) if(state.decisions[k]==='left') delete state.decisions[k]; state.undo=null; save(); renderDeck(); renderTop(); }
});
document.addEventListener('keydown', e => {
  if(e.key==='Escape' && !$('#overlay').hidden && !$('#overlay .full')){ closeModal(); return; }
  if(!$('#overlay').hidden || state.tab!=='discover' || $('#filters').classList.contains('on')) return;
  if(/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if(e.key==='ArrowRight') decide('right'); if(e.key==='ArrowLeft') decide('left');
});

function boot(){
  invalidate();
  showTab(state.onboarded ? state.tab : 'discover');
  if(!state.onboarded) openOnboarding(false);
  else if(!state.logs[TODAY] && state.promptedOn!==TODAY) openCheckin(false);
}
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
loadData().then(() => { boot(); if(DATA_NOTE) setTimeout(()=>toast(DATA_NOTE), 600); });
</script>

</body>
</html>
